name: Frontend CI

# Sin filtro de rama: una rama de feature como p10-6-hallazgos-degenerativos tiene que
# ver el CI antes del merge, no despues.
on:
  push:
  pull_request:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bumped from 22 to 24 (CLOUD-02): matches the Dockerfile's node:24-alpine build
      # stage exactly, closing the CI/runtime version drift flagged in CLOUD-00.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Las ~470 aserciones de scripts/*-tests.mjs. Los e2e de Playwright quedan fuera:
      # necesitan la app levantada y el backend detras.
      - name: Test
        run: npm run test

      # No es cobertura de lineas y el propio reporte lo aclara: las suites evaluan el codigo
      # dentro de un node:vm, que V8 no atribuye a los archivos de src/. Medido con c8,
      # clinicalDisplay.ts da 0% aunque tenga tests. Esto mide que modulos tienen alguna
      # prueba, que es la pregunta de riesgo, sin mentir sobre la profundidad.
      - name: Coverage summary
        if: always()
        run: npm run coverage

      - name: Build
        run: npm run build

  # La imagen se construye siempre, tambien en un PR: un Dockerfile roto tiene que
  # aparecer antes del merge.
  #
  # CLOUD-02: build-only, sin publicar a ningun registry. El workflow historico en `main`
  # ya empuja a GHCR en push a main -- esta rama no lo toca ni lo reemplaza, main sigue
  # intacto. Pero CLOUD-02 en si mismo no publica nada: push:false siempre, sin login, sin
  # packages:write. La publicacion real (a Google Artifact Registry) es CLOUD-03, con su
  # propio gate de costo/autorizacion.
  image:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # No se pasa VITE_API_BASE_URL a proposito: el backend se configura en runtime con
      # BACKEND_URL, que docker/entrypoint.sh escribe en env.js y que gana sobre lo que
      # quedo compilado. Es lo que permite que esta misma imagen sirva en cualquier
      # entorno sin recompilar.
      - name: Build (validation only, never pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pfi-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
