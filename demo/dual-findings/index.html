<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demostración · Hallazgos A/B (simulado)</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("pfi.theme");
          var theme = stored === "dark" || stored === "light"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          if (theme === "dark") document.documentElement.setAttribute("data-theme", "clinical");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "clinical");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
